name: cinema

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты из этой папки выполняются один раз при первом создании БД
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cinema:${POSTGRES_PASSWORD:-cinema}@db:5432/cinema
      TEST_DATABASE_URL: postgresql+psycopg://cinema:${POSTGRES_PASSWORD:-cinema}@db:5432/cinema_test
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-staff}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
