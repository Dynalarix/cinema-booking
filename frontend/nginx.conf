server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Все запросы к /api/ пересылаются в контейнер с FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Чтобы браузер не кэшировал старую клиентскую часть после обновления:
    # заставляем перепроверять свежесть перед каждой загрузкой.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
